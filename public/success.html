<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #28a745;
            margin-bottom: 20px;
        }
        .checkmark {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .ticket-info {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9f7ef;
            border-radius: 8px;
            border: 1px solid #d4edda;
        }
        .ticket-info p {
            margin: 5px 0;
            font-size: 1.2em;
            font-weight: bold;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">&#10003;</div>
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Your ticket has been confirmed.</p>
        <div class="ticket-info">
            <p>Your User ID: <span id="userIdDisplay"></span></p>
            <p>Transaction ID: <span id="transactionIdDisplay"></span></p>
            <p>Tickets Remaining: <span id="ticketsRemainingDisplay"></span></p>
        </div>
        <button onclick="window.location.href='/'">Back to Waiting Room</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = localStorage.getItem('ticketWarUserId') || 'Unknown';
        const transactionId = urlParams.get('transactionId') || 'N/A';
        const ticketsRemaining = urlParams.get('ticketsRemaining') || 'N/A';

        document.getElementById('userIdDisplay').textContent = userId;
        document.getElementById('transactionIdDisplay').textContent = transactionId;
        document.getElementById('ticketsRemainingDisplay').textContent = ticketsRemaining;

        // Clear the user ID so they can start fresh if they come back
        // But keep it for display purposes
    </script>
</body>
</html>
