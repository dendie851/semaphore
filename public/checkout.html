<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #28a745;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .token-info {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9f7ef;
            border-radius: 8px;
            border: 1px solid #d4edda;
            word-break: break-all;
        }
        .token-info p {
            margin: 5px 0;
            font-size: 1em;
            font-weight: bold;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .message {
            margin-top: 20px;
            font-weight: bold;
        }
        .success {
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
        .info {
            color: #17a2b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Proceed to Payment!</h1>
        <p>You have secured a slot. Please complete your payment within <span id="countdown"></span> seconds.</p>
        <div class="token-info">
            <p>Your User ID: <span id="userIdDisplay"></span></p>
            <p>Your Access Token: <span id="tokenDisplay"></span></p>
        </div>
        <button id="payButton">Complete Payment</button>
        <p id="paymentMessage" class="message"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userId = localStorage.getItem('ticketWarUserId');

        if (!token || !userId) {
            document.body.innerHTML = '<div class="container"><h1 class="error">403 Access Denied: Invalid or missing token/userId.</h1><p>Please go back to the <a href="/">waiting room</a>.</p></div>';
        } else {
            document.getElementById('userIdDisplay').textContent = userId;
            document.getElementById('tokenDisplay').textContent = token;

            let countdownTime = 300;
            const countdownElement = document.getElementById('countdown');
            const payButton = document.getElementById('payButton');
            const paymentMessage = document.getElementById('paymentMessage');
            let paymentInProgress = false;

            function updateCountdown() {
                countdownElement.textContent = countdownTime;
                if (countdownTime <= 0) {
                    clearInterval(countdownInterval);
                    payButton.disabled = true;
                    paymentMessage.className = 'message error';
                    paymentMessage.textContent = 'Time out! Your slot has been released. Please return to the waiting room.';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 5000);
                }
                countdownTime--;
            }

            updateCountdown();
            const countdownInterval = setInterval(updateCountdown, 1000);

            payButton.addEventListener('click', async () => {
                // Prevent double-click
                if (paymentInProgress) return;
                paymentInProgress = true;

                payButton.disabled = true;
                paymentMessage.className = 'message info';
                paymentMessage.textContent = 'Processing payment...';

                try {
                    const response = await fetch('/api/bayar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ token: token }),
                    });
                    const data = await response.json();

                    clearInterval(countdownInterval);

                    if (response.ok) {
                        // Success - redirect to success page with transaction info
                        const transactionId = data.transactionId || 'TX-' + Date.now();
                        window.location.href = `/success?transactionId=${transactionId}&ticketsRemaining=${data.ticketsRemaining}`;
                    } else if (response.status === 403) {
                        // Token invalid/expired - session already used or timed out
                        paymentMessage.className = 'message error';
                        paymentMessage.textContent = data.message || 'Session expired. This token is no longer valid.';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 3000);
                    } else {
                        // Payment failed (can retry)
                        paymentMessage.className = 'message error';
                        paymentMessage.textContent = data.message || 'Payment failed.';
                        payButton.disabled = false;
                        paymentInProgress = false;
                    }
                } catch (error) {
                    paymentMessage.className = 'message error';
                    paymentMessage.textContent = 'An error occurred during payment.';
                    console.error('Payment error:', error);
                    payButton.disabled = false;
                    paymentInProgress = false;
                }
            });
        }
    </script>
</body>
</html>
